services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: myapp
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: myapp
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myapp -d myapp"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://myapp:secret@db:5432/myapp
      NODE_ENV: production
      PORT: 3000
      CORS_ORIGIN: http://localhost:8000
      JWT_ACCESS_SECRET: dzfhfjhgykjyukgyuilufyhiluo;hio;hioh
      JWT_REFRESH_SECRET: aseergrhjftukluo;ij;/l;L;L;lnjk,cghnf
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:3000
    ports:
      - "8000:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
